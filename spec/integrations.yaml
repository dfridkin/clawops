# spec/integrations.yaml — OpenClaw channel integration catalog for the setup wizard.
# Read at runtime by src/cli/commands/setup.ts — not compiled or code-generated.
#
# Each integration maps to a key in the `channels` object of OpenClaw's config.
# infraRequired: true means a publicly reachable webhook URL must be registered
# with the provider after the stack is deployed.
#
# ── Checked against OpenClaw 2026.9.2 (WO-60) ────────────────────────────────
#
# EVERY channel in 2.0 is an install-gated plugin. `openclaw channels list --all --json`
# reports all 31 as `origin: "installable"`, and none is bundled — the same shape as model
# providers (WO-43), which is why `plugin:` below carries the package to install.
#
# Configuring a channel without installing it produces a gateway that starts, reports
# healthy, and never connects to the channel.
#
# `dmPolicy` and `groupPolicy` are REQUIRED by the schema on every channel here, and Slack
# and WhatsApp require more. `defaults:` carries OpenClaw's own default for each of them, and
# the wizard writes them — a JSON Schema default does not satisfy `required`, so a config
# omitting them is REJECTED. Every channel the wizard wrote was invalid before this.
#
# Every credential field also accepts a SecretRef — `{source: env, provider, id}` — as well
# as a plain string, so a token need not be inlined into the config.
#
# The catalog was wrong in four ways before this pass, all of which would have produced a
# config OpenClaw rejects or ignores: the Teams key was `teams` (the schema has `msteams`),
# Discord's token field was `botToken` (it is `token`), WhatsApp's `phoneNumberId` and
# `accessToken` do not exist on that channel at all, and EVERY `envDefault` used an
# `OPENCLAW_*` name that OpenClaw does not read.
#
# `envVar` below is the variable `openclaw channels add --use-env` actually reads, taken from
# the binary's own error message. `useEnvSupported: false` means that flag is rejected for the
# channel outright — measured, not assumed.
#
# `plugin.version` is pinned to the runtime floor, and it is not decoration. Measured on
# 2026.9.2: `@openclaw/discord@2026.9.3` refuses to install with
#
#   plugin "discord" requires plugin API >=2026.9.3, but this OpenClaw runtime exposes 2026.9.2
#
# The same drift that forced version pins on model providers in WO-43. `latest` would break
# the deploy the moment upstream publishes ahead of the runtime, which it already has.

integrations:
  - id: discord
    channelKey: discord
    displayName: Discord
    description: Connect OpenClaw agents to a Discord server via bot
    infraRequired: false
    plugin:
      package: "@openclaw/discord"
      source: npm
      version: "2026.9.2"
    useEnvSupported: true
    requiredConfig: [dmPolicy, groupPolicy]
    defaults:
      dmPolicy: pairing
      groupPolicy: allowlist
    fields:
      - name: token
        label: Bot token
        description: Bot token from the Discord Developer Portal (Bot → Token)
        sensitive: true
        envDefault: DISCORD_BOT_TOKEN
    setupUrl: https://discord.com/developers/applications

  - id: telegram
    channelKey: telegram
    displayName: Telegram
    description: Connect OpenClaw agents to a Telegram bot
    infraRequired: false
    # Bundled in the image: `channels add --channel telegram --use-env` succeeds with
    # `--network none`, so there is nothing to download and no egress needed. It is listed
    # as "installable" alongside the rest, which is why this looked unresolved at first.
    plugin:
      package: ""
      source: bundled
    useEnvSupported: true
    requiredConfig: [dmPolicy, groupPolicy]
    defaults:
      dmPolicy: pairing
      groupPolicy: allowlist
    fields:
      - name: botToken
        label: Bot token
        description: Token from @BotFather (/newbot)
        sensitive: true
        envDefault: TELEGRAM_BOT_TOKEN
    setupUrl: https://t.me/BotFather

  - id: slack
    channelKey: slack
    displayName: Slack
    description: Connect OpenClaw agents to a Slack workspace via app (Socket Mode)
    # Socket Mode, not a webhook. `mode` defaults to "socket" in OpenClaw and it is what
    # `channels add --use-env` drives: the gateway opens an OUTBOUND WebSocket to Slack, so
    # there is no public URL to register and no inbound rule to open.
    #
    # This entry said infraRequired: true — the `http` mode setup — while declaring the
    # socket credentials incompletely. It described one setup while the tooling installed
    # the other, and the config it produced failed validation either way.
    #
    # `mode: http` is still available: it needs a public webhook at `webhookPath` and a
    # signingSecret to verify inbound requests. That is a deliberate choice, not the default,
    # and clawops does not configure it.
    infraRequired: false
    plugin:
      package: "@openclaw/slack"
      source: npm
      version: "2026.9.2"
    # Socket Mode is what --use-env drives, and it demands SLACK_APP_TOKEN:
    #   "Slack Socket Mode requires SLACK_APP_TOKEN when using --use-env."
    useEnvSupported: true
    # Slack requires more than the two policies: the schema also demands postAs, mode,
    # webhookPath and userTokenReadOnly.
    requiredConfig: [dmPolicy, groupPolicy, postAs, mode, webhookPath, userTokenReadOnly]
    defaults:
      dmPolicy: pairing
      groupPolicy: allowlist
      postAs: bot
      mode: socket
      webhookPath: /slack/events
      userTokenReadOnly: true
    fields:
      - name: botToken
        label: Bot OAuth token
        description: "Bot User OAuth Token (starts with xoxb-)"
        sensitive: true
        envDefault: SLACK_BOT_TOKEN
      - name: appToken
        label: App-level token
        description: "App-level token for Socket Mode (starts with xapp-), from Basic Information → App-Level Tokens"
        sensitive: true
        envDefault: SLACK_APP_TOKEN
    setupUrl: https://api.slack.com/apps

  - id: whatsapp
    channelKey: whatsapp
    displayName: WhatsApp (via WABA)
    description: Connect OpenClaw agents to WhatsApp via the Meta Business API
    infraRequired: true
    infraNote: >
      After deployment, register the gateway webhook URL in the Meta Developer
      Console (WhatsApp → Configuration → Webhook). The gateway URL is printed
      at the end of setup.
    plugin:
      package: "@openclaw/whatsapp"
      source: npm
      version: "2026.9.2"
    # `openclaw channels add --use-env` answers: OpenClaw does not recognize option
    # "--use-env". There is no non-interactive path for this channel.
    useEnvSupported: false
    requiredConfig: [dmPolicy, groupPolicy, mediaMaxMb]
    defaults:
      dmPolicy: pairing
      groupPolicy: allowlist
      mediaMaxMb: 50
    # WhatsApp has no top-level credential fields in 2.0 — credentials live under
    # `accounts.<name>`, with `defaultAccount` selecting one. The wizard cannot collect a
    # flat token for it, so it is marked unsupported rather than collecting fields that go
    # nowhere. `phoneNumberId` and `accessToken`, which this entry used to declare, are not
    # properties of the whatsapp channel at all.
    wizardSupported: false
    unsupportedNote: >
      WhatsApp uses per-account credentials (`channels.whatsapp.accounts.<name>`) rather
      than a single token. Configure it with `openclaw channels add --channel whatsapp`
      on the host after deployment.
    fields: []
    setupUrl: https://developers.facebook.com/apps

  - id: msteams
    channelKey: msteams
    displayName: Microsoft Teams
    description: Connect OpenClaw agents to a Microsoft Teams channel via bot
    infraRequired: true
    infraNote: >
      After deployment, update the bot's messaging endpoint in Azure Bot Service
      to the gateway webhook URL.
    plugin:
      package: "@openclaw/msteams"
      source: npm
      version: "2026.9.2"
    # Same as WhatsApp: --use-env is rejected outright.
    useEnvSupported: false
    requiredConfig: [dmPolicy, groupPolicy]
    defaults:
      dmPolicy: pairing
      groupPolicy: allowlist
    fields:
      - name: appId
        label: App (client) ID
        description: Application ID from Azure Active Directory app registration
        sensitive: false
        envDefault: ""
      - name: appPassword
        label: App password
        description: Client secret from the Azure app registration
        sensitive: true
        envDefault: ""   # no --use-env path; collected interactively on the host
      - name: tenantId
        label: Directory (tenant) ID
        description: Azure AD tenant ID for the app registration
        sensitive: false
        envDefault: ""
    setupUrl: https://portal.azure.com/
