# MCP Tool Catalog — Single source of truth for clawops's MCP server.
# Generates src/mcp/tools/_generated.ts via scripts/gen-schemas.ts.
# Every tool MUST follow R1–R25 (see DESIGN_RULES.md).
#
# Key rules enforced in this file:
#   R1  — clawops_ prefix, toolset assignment, ≤30 tools total
#   R3  — descriptions include "Use when" and "Do NOT use when"
#   R5  — stackName optional with default; no hidden state
#   R6  — no credentials in inputs
#   R7  — paths are absolute
#   R8  — enums for closed sets
#   R10 — all four annotation hints set
#   R11 — annotations bound to safety modes (--read-only, --no-destructive)
#
# NOTE on `output:` — these blocks are DESCRIPTIVE, not generated. gen-schemas reads
# `input:` and `annotations:` only; nothing emits an MCP outputSchema, and no handler is
# checked against what its entry claims to return. Making them real means generating an
# outputSchema per tool and returning `structuredContent` from every handler — worth doing,
# but it is a change to all 18 handlers, not a spec edit. Until then, treat `output:` as the
# intended shape and the handler as the truth. Keeping them honest is not optional:
# clawops_status declared health, uptimeSec, openclawVersion and agentCount for three
# releases while returning none of them (WO-47).

version: 1

toolsets:
  - id: cli
    description: 1:1 mappings of clawops CLI commands. Default toolset.
  - id: workflow
    description: Composite agent workflows (R2). Encode user intent.
  - id: read
    description: Read-only tools, the ONLY toolset enabled in --read-only mode (R18).
  - id: admin
    description: Stack management and multi-stack ops. Requires admin profile.

# ────────────────────────────────────────────────────────────────────────────
# READ-ONLY TOOLS
# ────────────────────────────────────────────────────────────────────────────

tools:
  - name: clawops_status
    toolset: [cli, read]
    description: |
      Get what is deployed for a clawops-managed stack: public IP, gateway URL,
      SSH user, or that nothing is deployed yet. Reads stack outputs; does not
      contact the host.

      Use when: the user asks what exists for a stack, or where to reach it.

      Do NOT use when: the user asks whether the gateway is actually WORKING —
      that needs the host, so use clawops_doctor. Also not for live logs (use
      clawops_logs_tail) or config values (use clawops_config_get).
    annotations:
      title: Get Stack Status
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName:
        type: string
        optional: true
        description: Stack name. Defaults to active stack from config.
    # What the handler returns: the stack's deployment outputs. Health, version and agent
    # count are NOT here — they need the host, and asking for them is clawops_doctor.
    output:
      stack: { type: string }
      publicIp: { type: string }
      gatewayUrl: { type: string, format: uri }
      sshUser: { type: string }
      status: { type: enum, values: [not bootstrapped, not deployed] }
      region: { type: string }

  - name: clawops_doctor
    toolset: [cli, read]
    description: |
      Run clawops's diagnostics and return the report: Node and Pulumi runtime, config,
      SSH key and known_hosts, cloud credentials per configured provider, and the
      supported OpenClaw range. With stackName, also contacts the host for container
      state, the deployed OpenClaw version, a real gateway health probe, whether the
      port is published to the internet, disk usage on the state directory, log
      rotation, and hardening drift.

      Use when: something is not working and you do not yet know what; before any
      deploy, upgrade or migration; or to find out which OpenClaw version a gateway is
      actually running.

      Do NOT use when: you already know the problem and want to fix it. This tool only
      reports — it changes nothing, and never runs `openclaw doctor --fix`. No tool
      repairs a gateway: `clawops gateway update` is CLI-only, so tell the user to run
      it themselves, after `clawops backup create`.

      Every check carries a status: fail (something is wrong that clawops can name),
      warn (worth knowing, not broken), info (did not apply). `ok` is false only when
      something failed — a fresh machine with no stacks is full of warnings and healthy.
    annotations:
      title: Run Diagnostics
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName:
        type: string
        optional: true
        description: |
          Stack to include remote checks for. Without it, only the local machine is
          checked — no SSH connection is made.
      failuresOnly:
        type: boolean
        optional: true
        default: false
        description: Return only failing and warning checks. Passing checks are counted, not listed.
    output:
      ok: { type: boolean }
      counts: { type: object }
      sections: { type: array }

  - name: clawops_logs_tail
    toolset: [cli, read]
    description: |
      Tail recent gateway logs from a clawops-managed instance.

      Use when: the user wants to investigate recent activity or errors, or
      asks "what's been happening" on the gateway.

      Do NOT use when: the user wants real-time streaming logs (those are not
      well-suited to tool calls; suggest the user run `clawops logs -f` directly
      in their terminal). Do NOT use for instance-level system logs: no tool runs
      arbitrary remote commands, so tell the user to run `clawops ssh --command
      'journalctl ...'` themselves.
    annotations:
      title: Tail Gateway Logs
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's gateway to read. Omitted = the default stack in ~/.clawops/config.json" }
      tailLines: { type: integer, optional: true, default: 100, max: 1000, description: "How many of the most recent lines to return. Keep it small; output is trimmed to 8KB regardless" }
      sinceMin: { type: integer, optional: true, description: "Lines since N minutes ago" }
    output:
      lines: { type: array, items: { type: string }, description: "Trimmed log lines (R14: hard cap 8KB)" }
      truncated: { type: boolean }
      fullLogResource: { type: string, format: uri, description: "clawops:// URI for full log" }

  - name: clawops_monitor
    toolset: [cli, read]
    description: |
      Take a live snapshot of a running clawops stack: gateway health, container
      status, resource usage (CPU, memory, disk), and recent log lines.

      Use when: the user wants to know if the gateway is running, how much
      memory or CPU it is using, what recent log activity looks like, or
      wants a quick health overview richer than clawops_status.

      Do NOT use when: the user wants real-time streaming logs (use
      clawops_logs_tail or suggest `clawops logs -f`). Do NOT use for
      configuration queries (use clawops_config_get).
    annotations:
      title: Monitor Stack Health
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Stack name. Defaults to active stack." }
      tailLines: { type: integer, optional: true, default: 5, description: "Log lines to include in snapshot." }
    output:
      gateway:
        reachable: { type: boolean }
        version: { type: string }
        authMode: { type: string }
      container:
        status: { type: string }
        image: { type: string }
        restartCount: { type: integer }
        memUsage: { type: string }
        cpuPct: { type: string }
        uptime: { type: string }
      disk: { type: string }
      logLines: { type: array, items: { type: string } }
      capturedAt: { type: string, format: date-time }

  - name: clawops_stacks_list
    toolset: [admin, read]
    description: |
      List all clawops-managed stacks across all configured providers.

      Use when: the user wants an overview of their deployments, asks "what
      stacks do I have", or wants to compare stacks before an operation.

      Do NOT use when: the user named a specific stack — use clawops_status
      directly with that name.
    annotations:
      title: List Stacks
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    input: {}
    output:
      stacks:
        type: array
        items:
          type: object
          properties:
            name: { type: string }
            provider: { type: enum, values: [aws, gcp, azure, local] }
            region: { type: string }
            health: { type: enum, values: [healthy, degraded, down, unknown] }

  - name: clawops_config_get
    toolset: [cli, read]
    description: |
      Read a configuration value from the remote OpenClaw gateway.

      Use when: the user wants to inspect current OpenClaw config (e.g., which
      model provider is active, which channels are enabled).

      Do NOT use when: the user wants to change the config — use
      clawops_config_set instead.
    annotations:
      title: Get OpenClaw Config Value
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's gateway config to read. Omitted = the default stack in ~/.clawops/config.json" }
      key: { type: string, optional: true, description: "Dot-path config key, e.g., gateway.auth.mode. Omit to dump the full config." }
    output:
      value: { type: string, description: "Stringified value; complex objects are JSON-encoded" }

  - name: clawops_agents_list
    toolset: [cli, read]
    description: |
      List agents currently registered on the remote OpenClaw gateway.

      Use when: the user wants to see which agents are running, debug agent
      routing, or count active workspaces.

      Do NOT use when: the user wants one agent's logs — no tool exposes those; tell
      the user to run `clawops agents logs <name>`.
    annotations:
      title: List OpenClaw Agents
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's agents to list. Omitted = the default stack in ~/.clawops/config.json" }
    output:
      agents:
        type: array
        items:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: enum, values: [running, paused, errored, stopped] }
            channels: { type: array, items: { type: string } }

# ────────────────────────────────────────────────────────────────────────────
# MUTATING CLI TOOLS (destructive flagged per R10/R11; elicitation per R19)
# ────────────────────────────────────────────────────────────────────────────

  - name: clawops_up
    toolset: [cli]
    description: |
      Provision and deploy a clawops stack. Idempotent — re-running with no spec
      change produces no diff. Long-running (median 3min, p99 8min) so emits
      progress notifications per R12.

      Use when: the user explicitly asks to deploy, provision, create, or "spin
      up" a stack. Always after the user has reviewed a plan
      (clawops_plan first when in doubt).

      Do NOT use when: the user has not yet generated a plan and is in
      exploratory/discovery mode — use clawops_plan first. Do NOT use for an
      existing stack you only need to update; refresh first.
    annotations:
      title: Provision and Deploy Stack
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Name for the stack to provision, and the name every later command refers to it by. Omitted = the default stack in ~/.clawops/config.json" }
      provider:
        type: enum
        values: [aws, gcp, azure, local]
        optional: true
        description: Defaults to provider configured for this stack
      region: { type: string, optional: true, description: "Cloud region to deploy into, in the provider's own spelling (us-east-1, us-central1, eastus). Omitted = the region recorded for the stack" }
      instanceType:
        type: string
        optional: true
        default: small
        description: |
          A clawops size (micro|small|medium|large|gpu) or a provider-native machine type.
          Not an enum: Azure offers SKU families per subscription, and an account offered
          none of the five sizes clawops names would otherwise have no way to deploy.
      sshCidr:
        type: string
        optional: true
        description: |
          CIDR(s) allowed to reach SSH, comma-separated, or 'auto' for the caller's own
          address. Omitted means none, and nothing will be able to connect — including
          every clawops day-two command.
      gatewayCidr:
        type: string
        optional: true
        description: CIDR(s) allowed to reach the gateway port. Requires publishGateway=all.
      publishGateway:
        type: enum
        values: [loopback, all]
        optional: true
        description: Which interface the gateway binds. 'all' serves plaintext HTTP.
      openclawVersion: { type: string, optional: true, description: "semver or 'stable'/'dev'" }
      dryRun: { type: boolean, optional: true, default: false, description: "Show what would be created and change nothing. Use this first when the user has not yet approved a spend" }
    output:
      taskId: { type: string, description: "For >60s ops; poll clawops_task_status" }
      stackName: { type: string, description: "Name for the stack to provision, and the name every later command refers to it by. Omitted = the default stack in ~/.clawops/config.json" }
      gatewayUrl: { type: string, format: uri }
      resourceCount: { type: integer }

  - name: clawops_destroy
    toolset: [cli]
    description: |
      Destroy a clawops stack. Removes ALL provisioned resources. Triggers
      elicitation confirmation showing the resource diff before execution
      (R19). Cannot be undone.

      Use when: the user explicitly asks to destroy, tear down, delete, or
      remove a stack. Always confirm the stack name.

      Do NOT use when: the user wants to stop the gateway temporarily — that is not
      a destroy, and no tool stops a gateway; clawops_gateway_restart is the only
      gateway tool. Do NOT use when in doubt about which stack; list first with
      clawops_stacks_list.
    annotations:
      title: Destroy Stack (DESTRUCTIVE)
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, description: "The stack to destroy. Required, and worth repeating back to the user before calling: this deletes every resource it provisioned" }
      yes: { type: boolean, optional: true, default: false, description: "Skip elicitation; CI/scripted use only" }
    output:
      taskId: { type: string }
      destroyedResourceCount: { type: integer }

  - name: clawops_apply
    toolset: [cli]
    description: |
      Apply a previously-generated Maker plan (deploy-plan.schema.json).
      Deterministic — the plan describes exactly what will be created.

      Use when: the user has a plan file path and wants to apply it. This is
      the agent-friendly path for any deploy/destroy operation.

      Do NOT use when: there's no plan file — generate one first with
      clawops_plan.
    annotations:
      title: Apply Maker Plan
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    input:
      planPath: { type: string, description: "Absolute path to plan JSON (R7)" }
      yes: { type: boolean, optional: true, default: false, description: "Skip the confirmation and apply immediately. Only when the user has already approved this specific plan" }
    output:
      taskId: { type: string }
      summary: { type: string, description: "Trimmed; full output as resource (R14)" }

  - name: clawops_plan
    toolset: [cli, read]
    description: |
      Generate a Maker deploy plan (does NOT apply). Plan is JSON conforming to
      deploy-plan.schema.json — review before applying.

      Use when: the user wants to see what would be created before committing,
      or you (the agent) need a reviewable artifact for the user to approve.

      Do NOT use when: the user has explicitly asked to deploy and you already
      have their approval — go directly to clawops_up.
    annotations:
      title: Generate Deploy Plan
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack the plan is for. Omitted = the default stack in ~/.clawops/config.json" }
      provider: { type: enum, values: [aws, gcp, azure, local], optional: true, description: "Cloud to plan against. Omitted = the provider recorded for the stack. 'local' has no plan/apply path and is refused" }
      region: { type: string, optional: true, description: "Cloud region, in the provider's own spelling (us-east-1, us-central1, eastus). Omitted = the region recorded for the stack" }
      instanceType: { type: string, optional: true, description: "A clawops alias (micro|small|medium|large|gpu) or a machine type the cloud names itself, e.g. t3.small" }
      openclawVersion: { type: string, optional: true, description: "semver, or 'stable'/'dev'" }
      sshCidr: { type: string, optional: true, description: "CIDR(s) allowed to reach SSH, comma-separated, or 'auto' for this machine. Omitted = none, and nothing will be able to connect" }
      gatewayCidr: { type: string, optional: true, description: "CIDR(s) allowed to reach the gateway port, or 'auto'. Requires publishGateway=all" }
      publishGateway: { type: enum, values: [loopback, all], optional: true, description: "Which interface the gateway binds. loopback (default) keeps it off the network" }
      privateOnly: { type: boolean, optional: true, description: "Close public SSH and gateway access; reach the stack over its tailnet. Requires a verified tailnet address (clawops_harden with tailscale), and refuses unless that address answers SSH now" }
      outPath: { type: string, optional: true, description: "Absolute path to write plan; if omitted, plan returned inline" }
    output:
      planPath: { type: string, description: "Absolute path; only set if outPath provided" }
      summary:
        type: object
        description: "Trimmed; full plan available at the planPath or inline"

  - name: clawops_config_set
    toolset: [cli]
    description: |
      Set a configuration value on the remote OpenClaw gateway. Optionally
      restarts the gateway after.

      Use when: the user wants to change OpenClaw configuration (model
      provider, channel auth, gateway port).

      Do NOT use when: the user is reading config — use clawops_config_get.
      Do NOT bulk-edit; one key at a time so changes are auditable (R21).
    annotations:
      title: Set OpenClaw Config Value
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's gateway config to write. Omitted = the default stack in ~/.clawops/config.json" }
      key: { type: string, description: "Dotted path into the gateway config, e.g. models.provider or channels.slack.enabled" }
      value: { type: string, description: "Stringified; JSON for complex values" }
      restart: { type: boolean, optional: true, default: false, description: "Restart the gateway so the change takes effect. Without it the value is written and the running gateway keeps the old one" }
    output:
      message: { type: string, description: "Confirmation of the change applied" }

  - name: clawops_config_unset
    toolset: [cli]
    description: |
      Remove a configuration key from the remote OpenClaw gateway config, reverting
      it to the OpenClaw default.

      Use when: the user wants to delete a config key entirely (e.g., remove a
      channel, clear an override).

      Do NOT use when: the user wants to set the key to a new value — use
      clawops_config_set instead.
    annotations:
      title: Unset OpenClaw Config Key
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's gateway config to write. Omitted = the default stack in ~/.clawops/config.json" }
      key: { type: string, description: "Dot-path config key to remove" }
      restart: { type: boolean, optional: true, default: false, description: "Restart the gateway so the removal takes effect. Without it the key is removed and the running gateway keeps the old value" }
    output:
      message: { type: string, description: "Confirmation of the key removed" }

  - name: clawops_config_validate
    toolset: [cli, read]
    description: |
      Validate the remote OpenClaw gateway config against the known schema. Checks
      for structural errors (wrong types, unknown top-level keys) that would cause
      OpenClaw to fail on startup.

      Use when: the user wants to verify config before restarting the gateway, or
      after editing openclaw.json manually.

      Do NOT use when: the user wants to change config — use clawops_config_set.
    annotations:
      title: Validate OpenClaw Config
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's deployed config to validate. Omitted = the default stack in ~/.clawops/config.json" }
    output:
      valid: { type: boolean }
      issues: { type: array, items: { type: string } }

  - name: clawops_gateway_restart
    toolset: [cli]
    description: |
      Restart the OpenClaw gateway daemon on the remote instance.

      Use when: a gateway-wide config change requires reload, or the gateway is
      reported as unresponsive.

      Note: OpenClaw 2.0 removed per-agent restart; `gateway restart` is the only
      restart it offers, and it affects every agent on the host. Brief downtime (~10s).
    annotations:
      title: Restart Gateway Daemon
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack's gateway to restart. Omitted = the default stack in ~/.clawops/config.json" }
    output:
      restartedAt: { type: string, format: date-time }
      previousUptimeSec: { type: integer }

# ────────────────────────────────────────────────────────────────────────────
# COMPOSITE WORKFLOW TOOLS (R2: encode user intent, not API sequences)
# ────────────────────────────────────────────────────────────────────────────

  - name: clawops_init
    toolset: [cli]
    description: |
      Register a stack and write ~/.clawops/config.json: the provider, the state backend, the
      region, and an SSH key pair generated if one is not already there. Nothing is provisioned
      and nothing is charged; this only creates local configuration.

      Use when: any other clawops tool reports that there is no config, or the user wants to add
      a second stack alongside the ones they have. This is the first call on a machine that has
      never run clawops — a fresh container, a new laptop, a sandbox.

      Adding a stack is additive and safe: existing stacks are kept. Overwriting one needs
      force: true, because changing a state backend orphans the Pulumi state it points at — the
      infrastructure stays up and clawops can no longer see or destroy it.

      For aws, gcp and azure, stateUrl can be omitted and clawops names a bucket from the
      account it can see; that needs cloud credentials in the environment, so in a sandbox pass
      stateUrl explicitly. The local provider needs host instead, and no cloud account at all.

      Do NOT use when: the user wants to deploy — that is clawops_up, after this. Credentials
      are never passed here: clawops reads them from the environment (R6).
    annotations:
      title: Initialise clawops Config
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    input:
      provider: { type: enum, values: [aws, gcp, azure, local], description: "Which cloud this stack deploys to, or 'local' for a machine you already have" }
      stackName: { type: string, optional: true, description: "Name for the stack, used by every later call. Omitted = \"default\"" }
      stateUrl: { type: string, optional: true, description: "Where Pulumi state lives, e.g. s3://bucket/clawops, gs://bucket/clawops, azblob://container. Omitted = clawops names one from the cloud account it can see, which needs credentials" }
      region: { type: string, optional: true, description: "Cloud region in the provider's own spelling. Omitted = us-east-1 (aws), us-central1 (gcp), eastus (azure)" }
      host: { type: string, optional: true, description: "[local only] Hostname or IP of the machine to manage. Required when provider is local" }
      sshUser: { type: string, optional: true, description: "[local only] SSH login user. Omitted = root" }
      sshPort: { type: integer, optional: true, description: "[local only] SSH port. Omitted = 22" }
      force: { type: boolean, optional: true, description: "Overwrite a stack that already exists. Refused without it, because replacing a state backend orphans the state it points at" }
    output:
      configPath: { type: string }
      stackName: { type: string }
      stateUrl: { type: string }

  - name: clawops_harden
    toolset: [cli]
    description: |
      Apply security hardening to a deployed stack: SSH, UFW, fail2ban,
      unattended-upgrades, the Docker socket, and per-cloud checks. Optionally join
      the stack to a Tailscale network and reach it there instead of over the public
      internet.

      Use when: the user asks to harden, secure, or lock down a stack; asks what the
      hardening report says (with dryRun: true, which changes nothing); or asks to put
      a stack on their tailnet.

      tailscale: true installs Tailscale, joins the tailnet as clawops-<stack>, and
      then moves clawops onto that address — but only after opening an SSH session to
      it, against host keys pinned over the connection already trusted. If that fails,
      nothing is recorded and the public address stays in use. The auth key comes from
      `clawops secret set TAILSCALE_AUTH_KEY` and is never passed through this tool
      (R6).

      tailscaleRevert: true takes the host back off the tailnet, over its public
      address. On a private-only stack it refuses and names the plan/apply commands
      that reopen SSH first — relay them rather than trying to work around it.

      To close the public ports afterwards, plan with privateOnly: true and apply that
      plan; this tool does not change firewall rules.

      Do NOT use when: the user wants to know whether a stack is healthy — that is
      clawops_doctor. Do NOT pass tailscale and tailscaleRevert together.
    annotations:
      title: Harden Stack
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack to harden. Omitted = the default stack in ~/.clawops/config.json" }
      options: { type: string, optional: true, description: "Comma-separated module IDs; default is every defaultOn module for the provider" }
      dryRun: { type: boolean, optional: true, default: false, description: "Report the current state, change nothing" }
      tailscale: { type: boolean, optional: true, default: false, description: "Join the tailnet, verify this machine reaches the host there, then use that address" }
      tailscaleRevert: { type: boolean, optional: true, default: false, description: "Leave the tailnet and go back to the public address" }
      yes: { type: boolean, optional: true, default: false, description: "Skip elicitation; CI/scripted use only" }
    output:
      modules:
        type: array
        description: "Per module: id, status, whether it changed anything, and detail"
      tailnet:
        type: object
        description: "Set when tailscale or tailscaleRevert ran: the address now in use, or why it was refused"

  - name: clawops_workflow_deploy_app
    toolset: [workflow]
    description: |
      Single-tool workflow that takes a user from "I want to deploy OpenClaw
      to <provider>" to a verified, healthy gateway. Internally: plan → user
      confirms (elicitation) → up → wait for healthy → return URL.

      Use when: the user expresses end-to-end deployment intent ("deploy to
      AWS", "spin up an OpenClaw on GCP for me").

      Do NOT use when: the user is mid-deployment and only needs one step
      (e.g., they already have a plan; use clawops_apply). Do NOT use for
      destroying or updating — separate workflows.
    annotations:
      title: Deploy OpenClaw (End-to-End Workflow)
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input:
      provider: { type: enum, values: [aws, gcp, azure, local], description: "Cloud to deploy to. Omitted = the default provider in ~/.clawops/config.json" }
      region: { type: string, optional: true, description: "Cloud region, in the provider's own spelling (us-east-1, us-central1, eastus). Omitted = the provider's default" }
      stackName: { type: string, optional: true, default: "default", description: "Name for the new stack. Omitted = the default stack name in ~/.clawops/config.json" }
      instanceType: { type: enum, values: [micro, small, medium, large, gpu], optional: true, default: small, description: "Machine size: a clawops alias (micro|small|medium|large|gpu) or a type the cloud names itself, e.g. t3.small" }
    output:
      taskId: { type: string }
      gatewayUrl: { type: string, format: uri }
      stackName: { type: string, description: "Name for the new stack. Omitted = the default stack name in ~/.clawops/config.json" }

  - name: clawops_workflow_recover
    toolset: [workflow, read]
    description: |
      Diagnostic workflow for an unhealthy stack. Internally: status check →
      gateway logs → agent logs → systemd service status → produces a structured
      diagnostic report with suggested remediation.

      Use when: the user reports any "not working" symptom and you don't know
      where to start. Best entry point for troubleshooting.

      Do NOT use when: the user has already identified the problem and asks for
      a specific fix.
    annotations:
      title: Recover/Diagnose Stack
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input:
      stackName: { type: string, optional: true, description: "Which stack to diagnose. Omitted = the default stack in ~/.clawops/config.json" }
    output:
      report:
        type: object
        properties:
          gatewayHealth: { type: string }
          gatewayLogsExcerpt: { type: array, items: { type: string } }
          systemdStatus: { type: string }
          suggestedActions: { type: array, items: { type: string } }

  - name: clawops_task_status
    toolset: [cli, read]
    description: |
      Poll the status of a long-running clawops task (returned by clawops_up,
      clawops_destroy, clawops_apply, etc.). Per R12 streaming model.

      Use when: the user is waiting on a long-running deploy/destroy and wants
      progress, OR you need to check whether a previously-started operation
      finished.

      Do NOT use when: there is no active taskId — start the operation first.
    annotations:
      title: Get Task Status
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    input:
      taskId: { type: string, description: "The taskId returned by a long-running tool such as clawops_up, clawops_apply or clawops_destroy" }
    output:
      status: { type: enum, values: [working, input_required, completed, failed, cancelled] }
      progress: { type: number, minimum: 0, maximum: 1 }
      message: { type: string, optional: true }
      result: { type: object, optional: true, description: "Present when status=completed" }
      error: { type: string, optional: true, description: "Present when status=failed" }
