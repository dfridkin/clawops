# Headscale for the fleet e2e suite: a private control server on the suite's Docker network.
# No secrets here: auth keys are made by the suite at run time and die with the container.
server_url: http://hs:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
# No relay: every node is on the same Docker network, so paths are direct (derp.yaml names a
# region that cannot be reached, which Headscale needs to start with no DERP at all).
derp:
  server:
    enabled: false
  urls: []
  paths: [/etc/headscale/derp.yaml]
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
dns:
  magic_dns: true
  base_domain: fleet.test
  nameservers:
    global: [1.1.1.1]
# Set with `headscale policy set`, so a test can swap the policy without a restart.
policy:
  mode: database
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"
log:
  level: warn
