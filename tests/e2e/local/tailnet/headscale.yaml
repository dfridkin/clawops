# Headscale for the fleet e2e suite: a private control server on the suite's Docker network.
# No secrets here: the auth keys and the TLS certificate are made by the suite at run time and die
# with the run.
server_url: https://hs:8443
listen_addr: 0.0.0.0:8443
# TLS because tailscaled reaches the embedded DERP relay over HTTPS only. The certificate is
# self-signed for "hs", and every node trusts it through SSL_CERT_FILE.
tls_cert_path: /etc/headscale/tls/cert.pem
tls_key_path: /etc/headscale/tls/key.pem
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
# A relay, as every real tailnet has. Without one a node's first WireGuard handshake to another
# took 15 s to more than 90 s in CI, while disco pings answered at once.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: e2e
    region_name: fleet e2e
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
dns:
  magic_dns: true
  base_domain: fleet.test
  nameservers:
    global: [1.1.1.1]
# Set with `headscale policy set`, so a test can swap the policy without a restart.
policy:
  mode: database
unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"
log:
  level: warn
