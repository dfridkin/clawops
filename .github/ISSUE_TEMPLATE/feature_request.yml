name: Feature request
description: Propose a new feature or enhancement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a feature request, check the [public roadmap](../docs/roadmap.md) and
        [limitations doc](../docs/limitations.md) — some items are already planned or
        explicitly out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation where you hit a wall. "I'm trying to X, but I can't because Y."
        Feature requests grounded in a real use case are easier to evaluate.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Include example commands or output if helpful.
      placeholder: |
        `clawops cost estimate` — print an approximate monthly cost before provisioning based
        on the instance type and region in the plan file:

        ```
        Estimated cost: ~$12/month (t3.small, us-east-1)
        Breakdown: EC2 $8.50 + EBS 30 GB $3.00 + data transfer ~$0.50
        ```
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI command (new or extended)
        - MCP tool (new or extended)
        - Provider (AWS / GCP / Azure / local)
        - Setup wizard
        - Plan/apply workflow
        - Security / access control
        - Documentation
        - Testing / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you tried or considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, prior art, related issues, or anything else relevant.
