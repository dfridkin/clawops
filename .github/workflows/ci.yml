name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated files are up to date
        run: pnpm gen:schemas --check

      - name: Verify no .docx files
        run: pnpm exec tsx scripts/verify-no-docx.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Links between docs, followed the way a reader follows them. A renamed heading leaves
      # the prose reading correctly and the link going nowhere; review does not catch that.
      - name: Verify doc links resolve
        run: pnpm verify:docs

      - name: Test
        run: pnpm test --coverage

      # Everything above runs from source, where tsx and vitest resolve modules by CommonJS
      # rules. 2.0.1 passed all of it and then failed on its first import once installed,
      # because the published bundle is ESM and Node resolves it differently. This step runs
      # the artifact a user gets.
      - name: Verify the packed tarball runs
        run: pnpm verify:pack

      # The other half of the product, over its own protocol: the tool list a client receives,
      # the annotations on it, the confirmation a destructive tool raises, and stdout purity.
      # A handler can be right while the server serves nothing.
      - name: Verify the MCP server over the protocol
        run: pnpm build && pnpm verify:mcp

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The image Glama builds to decide whether this server is listable. It shipped in 2.1 having
  # never been built: the first real build failed on a missing `mkdir`, Glama fell back to a spec
  # it inferred, ran `clawops` with no subcommand, and got the CLI's help text where it wanted a
  # handshake. Its own job, so a Docker daemon is never a dependency of the unit suite.
  docker:
    name: docker image speaks MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Build the image and hold it to the protocol
        run: node scripts/dev/verify-docker.mjs
