name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.6.0)'
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify version matches input
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match input (${{ github.event.inputs.version }})"
            exit 1
          fi
          echo "Publishing @clawops/cli@$PKG_VERSION to GitHub Packages"

      - name: Publish to GitHub Packages
        run: |
          npm config set "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          # --no-provenance: GitHub Packages does not support npm provenance
          # statements (that feature is npmjs.com-only). publishConfig.provenance
          # in package.json is correct for the primary registry; suppress it here.
          npm publish --registry https://npm.pkg.github.com --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
