name: OpenClaw schema drift

# Re-captures the OpenClaw config schema from the pinned image and reports when it
# moves. Not a PR check: the image is ~3.2 GB, so pulling it on every pull request
# would cost far more than the drift is worth. Weekly, plus on demand.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenClaw version to capture (default: support.recommended)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Check captured schema against the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-capture
        run: bash scripts/openclaw/capture-schema.sh ${{ inputs.version }}

      - name: Diff
        id: diff
        run: |
          if git diff --quiet -- spec/openclaw-2.0.config.schema.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The schema is one minified line, so a raw diff is unreadable. Report the
            # shape change instead: which top-level properties appeared or vanished.
            git stash --quiet
            node -e 'const s=require("./spec/openclaw-2.0.config.schema.json");require("fs").writeFileSync("/tmp/before.json",JSON.stringify(Object.keys(s.properties).sort()))'
            git stash pop --quiet
            node -e '
              const before=new Set(JSON.parse(require("fs").readFileSync("/tmp/before.json","utf8")));
              const after=Object.keys(require("./spec/openclaw-2.0.config.schema.json").properties);
              const added=after.filter(k=>!before.has(k));
              const removed=[...before].filter(k=>!after.includes(k));
              const out=["Top-level properties added: "+(added.join(", ")||"(none)"),
                         "Top-level properties removed: "+(removed.join(", ")||"(none)")].join("\n");
              console.log(out); require("fs").writeFileSync("/tmp/summary.txt", out);
            '
          fi

      - name: Open an issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "OpenClaw config schema drifted" \
            --label "openclaw-2.0" \
            --body "$(printf 'The schema emitted by the pinned OpenClaw image no longer matches `spec/openclaw-2.0.config.schema.json`.\n\n%s\n\nRe-capture with:\n\n```\nbash scripts/openclaw/capture-schema.sh\n```\n\nRun: %s\n' "$(cat /tmp/summary.txt)" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
