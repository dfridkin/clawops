name: Release

on:
  push:
    # main is the 2.x line; 1.x is the maintenance line (see docs/support-matrix.md).
    # One workflow serves both so it does not have to be fixed twice; the only
    # per-branch difference is the dist-tag, computed below.
    branches: [main, '1.x']
    paths:
      - '.changeset/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships with npm 11.5.1+ which added OIDC automated token
          # support (npm trusted publishing). npm 10.x has no OIDC auth code.
          node-version: '24.x'
          cache: pnpm
          # registry-url is required: it tells npm which registry to use for
          # the OIDC exchange. NODE_AUTH_TOKEN is intentionally not set so the
          # _authToken template expands to empty string (falsy), leaving npm
          # free to attempt the OIDC exchange instead.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # ci-publish.sh temporarily hides pnpm detection signals so
          # @changesets/cli calls `npm publish` instead of `pnpm publish`.
          # npm 11.5.1+ then performs the OIDC automated token exchange
          # (npm trusted publishing configured on npmjs.com).
          # 1.x publishes under the `v1` dist-tag so it cannot take `latest` back
          # from 2.x. main passes no tag and keeps changesets' default of `latest`.
          publish: bash scripts/ci-publish.sh ${{ github.ref_name == '1.x' && 'v1' || '' }}
        env:
          # PAT required so the Version Packages PR triggers CI
          # (GITHUB_TOKEN-created PRs don't trigger other workflows)
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT }}
          # NPM_TOKEN intentionally absent — OIDC handles auth.
          # provenance is handled by publishConfig.provenance:true in package.json

      - name: Publish to MCP Registry
        # Also runs on manual dispatch, so a registry entry that fell behind can be
        # backfilled without waiting for the next release. The registry was stuck on
        # 1.2.1 because this step had been failing silently-ish for several releases.
        #
        # main only: the registry serves one current version per server, so a 1.x
        # patch published after 2.0.0 would drag the entry backwards for every MCP
        # client discovering clawops through it.
        if: >-
          (steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
          && github.ref_name == 'main'
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          echo "Registering @clawops/cli@${VERSION} with the MCP registry"

          # Sync server.json with the version that was just published.
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = version;
            s.packages[0].version = version;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          ' "$VERSION"

          # The registry validates a submission by querying npm for the version, and
          # npm takes a moment to serve a freshly published package. Without this wait
          # the registry 404s and the whole release run goes red even though the npm
          # publish succeeded — which is what happened for both 1.7.2 and 1.7.3.
          echo "Waiting for npm to serve ${VERSION}..."
          npm_ready=false
          for i in $(seq 1 30); do
            if npm view "@clawops/cli@${VERSION}" version >/dev/null 2>&1; then
              npm_ready=true
              echo "npm is serving ${VERSION} (after $(( (i - 1) * 10 ))s)"
              break
            fi
            sleep 10
          done
          if [ "$npm_ready" != "true" ]; then
            echo "::error::npm did not serve ${VERSION} within 5 minutes; not registering with the MCP registry."
            echo "The npm publish itself succeeded — re-run this workflow to register."
            exit 1
          fi

          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

          ./mcp-publisher login github-oidc

          # Retry the publish itself: the registry can still be reading a stale npm
          # cache immediately after the version appears.
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              echo "Registered @clawops/cli@${VERSION}"
              exit 0
            fi
            echo "publish attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          echo "::error::MCP registry publish failed after 3 attempts. npm release is unaffected."
          exit 1
