name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write      # required for npm trusted publishing (OIDC)
      packages: write      # required for GitHub Packages publish

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships with npm 11.5.1+ which added OIDC automated token
          # support (npm trusted publishing). npm 10.x has no OIDC auth code.
          node-version: '24.x'
          cache: pnpm
          # registry-url is required: it tells npm which registry to use for
          # the OIDC exchange. NODE_AUTH_TOKEN is intentionally not set so the
          # _authToken template expands to empty string (falsy), leaving npm
          # free to attempt the OIDC exchange instead.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # ci-publish.sh temporarily hides pnpm detection signals so
          # @changesets/cli calls `npm publish` instead of `pnpm publish`.
          # npm 11.5.1+ then performs the OIDC automated token exchange
          # (npm trusted publishing configured on npmjs.com).
          publish: bash scripts/ci-publish.sh
        env:
          # PAT required so the Version Packages PR triggers CI
          # (GITHUB_TOKEN-created PRs don't trigger other workflows)
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PAT }}
          # NPM_TOKEN intentionally absent — OIDC handles auth.
          # provenance is handled by publishConfig.provenance:true in package.json

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          # setup-node wrote .npmrc only for registry.npmjs.org; add GitHub Packages auth.
          # GITHUB_TOKEN is used here (not ACTIONS_PAT) because GitHub Packages
          # requires write:packages scope, which GITHUB_TOKEN gets automatically
          # when packages: write is declared in permissions above.
          # --no-provenance: GitHub Packages does not support npm provenance
          # statements (npmjs.com-only feature).
          npm config set "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --registry https://npm.pkg.github.com --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to MCP Registry
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Sync server.json version with the just-published package.json
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = process.env.VERSION;
            s.packages[0].version = process.env.VERSION;
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "

          # Install mcp-publisher
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

          # Authenticate via GitHub Actions OIDC (uses id-token: write permission)
          ./mcp-publisher login github-oidc

          # Publish to registry
          ./mcp-publisher publish
        env:
          VERSION: ${{ steps.changesets.outputs.publishedPackages }}
